server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Безопасные заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Кэширование статики. `expires` сам проставляет Cache-Control/Expires;
    # отдельный add_header здесь ломает наследование заголовков безопасности выше.
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Прокси API на backend — всё работает на одном origin.
    location /api/ {
        proxy_pass http://backend:1488;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA / статические страницы
    location / {
        try_files $uri $uri/ /index.html;
    }
}

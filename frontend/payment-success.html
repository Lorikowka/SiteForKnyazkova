<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка оплаты...</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    .status-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d9 100%);
    }
    .status-card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .status-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      animation: scaleIn 0.5s ease-out;
    }
    .status-icon.loading {
      background: linear-gradient(135deg, #667eea, #764ba2);
      animation: pulse 1.5s infinite;
    }
    .status-icon.success {
      background: linear-gradient(135deg, #4CAF50, #8BC34A);
    }
    .status-icon.error {
      background: linear-gradient(135deg, #f44336, #e91e63);
    }
    @keyframes scaleIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .status-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #2c2c2c;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 16px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 32px;
    }
    .status-btn {
      display: inline-block;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .status-btn.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .status-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .status-btn.error {
      background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
    }
    .status-btn.error:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="status-page">
  <div class="status-card">
    <!-- Загрузка -->
    <div id="loading-state">
      <div class="status-icon loading">⏳</div>
      <h1 class="status-title">Проверяем оплату...</h1>
      <p class="status-text">Пожалуйста, подождите</p>
    </div>

    <!-- Успех -->
    <div id="success-state" class="hidden">
      <div class="status-icon success">✓</div>
      <h1 class="status-title">Оплата прошла успешно!</h1>
      <p class="status-text">Спасибо! Мы скоро свяжемся с вами для подтверждения записи.</p>
      <p class="status-text" style="font-size: 14px; color: #999;">Перенаправляем на главную...</p>
    </div>

    <!-- Ошибка/Отмена -->
    <div id="error-state" class="hidden">
      <div class="status-icon error">✕</div>
      <h1 class="status-title" id="error-title">Оплата не прошла</h1>
      <p class="status-text" id="error-text">К сожалению, платёж не был обработан.</p>
      <a href="index.html#payment" class="status-btn error">Попробовать снова</a>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paymentId = urlParams.get('payment_id');

  const loadingState = document.getElementById('loading-state');
  const successState = document.getElementById('success-state');
  const errorState = document.getElementById('error-state');
  const errorTitle = document.getElementById('error-title');
  const errorText = document.getElementById('error-text');

  function showState(state) {
    loadingState.classList.add('hidden');
    successState.classList.add('hidden');
    errorState.classList.add('hidden');
    state.classList.remove('hidden');
  }

  if (!paymentId) {
    // Нет ID — сразу ошибка
    errorTitle.textContent = 'Оплата отменена';
    errorText.textContent = 'Вы не завершили оплату. Если хотите записаться — попробуйте снова.';
    showState(errorState);
  } else {
    // Проверяем статус
    fetch(`/api/payment/${paymentId}`)
      .then(res => res.json())
      .then(data => {
        if (data.success && data.payment) {
          const status = data.payment.status;
          
          if (status === 'succeeded' || status === 'waiting_for_capture') {
            // Успех — редирект на главную
            showState(successState);
            setTimeout(() => {
              window.location.href = 'index.html#contacts';
            }, 2000);
          } else if (status === 'canceled' || status === 'expired') {
            // Отмена
            errorTitle.textContent = 'Оплата отменена';
            errorText.textContent = 'Платёж был отменён. Вы можете попробовать снова.';
            showState(errorState);
          } else {
            // Pending или другой статус
            errorTitle.textContent = 'Оплата в обработке';
            errorText.textContent = 'Платёж ещё обрабатывается. Попробуйте обновить страницу через несколько секунд.';
            showState(errorState);
          }
        } else {
          errorTitle.textContent = 'Ошибка';
          errorText.textContent = 'Не удалось проверить статус платежа.';
          showState(errorState);
        }
      })
      .catch(err => {
        errorTitle.textContent = 'Ошибка соединения';
        errorText.textContent = 'Не удалось подключиться к серверу. Попробуйте позже.';
        showState(errorState);
      });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.yookassa.ru http://localhost:1488 http://127.0.0.1:1488; frame-src 'self' https://yookassa.ru; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Оплата не завершена — Екатерина Князькова</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #1f5f44;
      --green-mid: #2c7a55;
      --green-light: #eef6f0;
      --text: #333;
      --text-muted: #666;
      --bg: #f8fbf8;
      --error: #c0392b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: #fff;
      background: var(--error);
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 14px; }
    p { font-size: 16px; color: var(--text-muted); margin-bottom: 24px; }
    .payment-details {
      background: var(--bg);
      border: 1.5px solid #dde8e2;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .payment-details .row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; font-size: 14px; }
    .payment-details .row span { color: var(--text-muted); }
    .payment-details .row strong { color: var(--text); word-break: break-all; text-align: right; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 14px 30px; border-radius: 30px;
      text-decoration: none; font-weight: 600; font-size: 16px;
      border: none; cursor: pointer; transition: background 0.2s, transform 0.15s;
    }
    .btn.primary { background: var(--green-mid); color: #fff; }
    .btn.primary:hover { background: var(--green-dark); transform: translateY(-1px); }
    .btn.outline { background: var(--green-light); color: var(--green-mid); }
    .btn.outline:hover { background: #d6eddf; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .support-link { display: inline-block; color: var(--green-mid); text-decoration: none; font-size: 14px; margin-top: 20px; }
    .support-link:hover { text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">✕</div>
  <h1 id="fail-title">Платёж не прошёл</h1>
  <p id="fail-text">К сожалению, оплата не была завершена. Это могло произойти из-за ошибки банка или по истечении времени ожидания.</p>

  <div class="payment-details hidden" id="details">
    <div class="row"><span>Статус:</span><strong id="detail-status">—</strong></div>
    <div class="row"><span>Сумма:</span><strong id="detail-amount">—</strong></div>
    <div class="row"><span>ID платежа:</span><strong id="detail-id">—</strong></div>
  </div>

  <div class="actions">
    <button type="button" class="btn primary" id="retry-btn">Попробовать снова</button>
    <a href="index.html" class="btn outline">На главную</a>
  </div>

  <a href="https://t.me/Ekaterina_K" target="_blank" rel="noopener" class="support-link">Написать в Telegram</a>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/payment-failed.js"></script>
</body>
</html>

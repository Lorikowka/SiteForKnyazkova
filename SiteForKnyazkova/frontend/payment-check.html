<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка оплаты...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d9 100%);
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: white;
    }
    .icon.loading { background: linear-gradient(135deg, #667eea, #764ba2); animation: pulse 1.5s infinite; }
    .icon.success { background: linear-gradient(135deg, #4CAF50, #8BC34A); }
    .icon.error { background: linear-gradient(135deg, #f44336, #e91e63); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    h1 { font-family: 'Playfair Display',serif; font-size: 28px; font-weight: 700; color: #2c2c2c; margin-bottom: 16px; }
    p { font-size: 16px; line-height: 1.6; color: #666; margin-bottom: 24px; }
    .detail { font-size: 14px; color: #999; margin-bottom: 8px; }
    .btn {
      display: inline-block; color: white; padding: 14px 32px; border-radius: 8px;
      text-decoration: none; font-weight: 500; transition: transform 0.2s, box-shadow 0.2s;
      border: none; cursor: pointer; font-size: 16px;
    }
    .btn.primary { background: linear-gradient(135deg,#667eea,#764ba2); }
    .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
    .btn.error { background: linear-gradient(135deg,#f44336,#e91e63); }
    .btn.error:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244,67,54,0.4); }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- Загрузка -->
  <div id="loading">
    <div class="icon loading">⏳</div>
    <h1>Проверяем оплату...</h1>
    <p>Пожалуйста, подождите</p>
  </div>

  <!-- Успех -->
  <div id="success" class="hidden">
    <div class="icon success">✓</div>
    <h1>Оплата прошла успешно!</h1>
    <p>Спасибо! Мы скоро свяжемся с вами для подтверждения записи.</p>
    <p class="detail">Перенаправляем на главную...</p>
  </div>

  <!-- Ошибка -->
  <div id="error" class="hidden">
    <div class="icon error">✕</div>
    <h1 id="error-title">Оплата не прошла</h1>
    <p id="error-text">К сожалению, платёж не был обработан.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="index.html#payment" class="btn error">Попробовать снова</a>
      <a href="index.html" class="btn primary">На главную</a>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paymentId = urlParams.get('payment_id');
  const isMock = urlParams.get('mock') === 'true';

  let retries = 0;
  const MAX_RETRIES = 10;
  const RETRY_INTERVAL = 2000;

  function showState(id) {
    ['loading','success','error'].forEach(s => {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  // В MOCK режиме автоматически подтверждаем платёж
  function confirmMockPayment() {
    if (!isMock || !paymentId) return Promise.resolve(false);

    return fetch(`/api/mock-payment-success/${encodeURIComponent(paymentId)}`, {
      method: 'POST'
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        console.log('✅ MOCK платёж подтверждён');
        return true;
      }
      return false;
    })
    .catch(err => {
      console.error('❌ Ошибка подтверждения MOCK платежа:', err);
      return false;
    });
  }

  function checkPayment() {
    if (!paymentId) {
      document.getElementById('error-title').textContent = 'Оплата отменена';
      document.getElementById('error-text').textContent = 'Вы не завершили оплату. Попробуйте записаться снова.';
      showState('error');
      return;
    }

    // В MOCK режиме сначала подтверждаем платёж
    if (isMock && retries === 0) {
      confirmMockPayment().then(confirmed => {
        if (confirmed) {
          // После подтверждения проверяем статус
          setTimeout(checkPayment, 500);
        } else {
          document.getElementById('error-title').textContent = 'Ошибка';
          document.getElementById('error-text').textContent = 'Не удалось подтвердить MOCK платёж.';
          showState('error');
        }
      });
      return;
    }

    fetch(`/api/payment/${encodeURIComponent(paymentId)}`)
      .then(res => res.json())
      .then(data => {
        if (data.success && data.payment) {
          const status = data.payment.status;

          if (status === 'succeeded' || status === 'waiting_for_capture') {
            showState('success');
            setTimeout(() => { window.location.href = 'index.html?payment_success=true'; }, 2000);
          } else if (status === 'canceled' || status === 'expired') {
            document.getElementById('error-title').textContent = 'Оплата отменена';
            document.getElementById('error-text').textContent = 'Платёж был отменён. Вы можете попробовать снова.';
            showState('error');
          } else {
            // pending — повторяем проверку
            retries++;
            if (retries < MAX_RETRIES) {
              setTimeout(checkPayment, RETRY_INTERVAL);
            } else {
              document.getElementById('error-title').textContent = 'Оплата в обработке';
              document.getElementById('error-text').textContent = 'Платёж ещё обрабатывается. Обновите страницу через несколько минут или свяжитесь с нами в Telegram.';
              showState('error');
            }
          }
        } else {
          document.getElementById('error-title').textContent = 'Ошибка';
          document.getElementById('error-text').textContent = 'Не удалось проверить статус платежа.';
          showState('error');
        }
      })
      .catch(() => {
        retries++;
        if (retries < MAX_RETRIES) {
          setTimeout(checkPayment, RETRY_INTERVAL);
        } else {
          document.getElementById('error-title').textContent = 'Ошибка соединения';
          document.getElementById('error-text').textContent = 'Не удалось подключиться к серверу. Попробуйте позже.';
          showState('error');
        }
      });
  }

  // Начинаем проверку
  checkPayment();
</script>
</body>
</html>

services:
  backend:
    build: ./backend
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "1488:1488"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=1488
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1488/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  vk-bot:
    build:
      context: .
      dockerfile: vk-bot/Dockerfile
    container_name: app_vk_bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - BACKEND_URL=http://backend:1488
    volumes:
      - ./vk-bot/data:/app/data
      - ./vk-bot/logs:/app/logs
    depends_on:
      - backend

  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    container_name: app_telegram_bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - BACKEND_URL=http://backend:1488
    volumes:
      - ./telegram-bot/logs:/app/logs
    depends_on:
      - backend
